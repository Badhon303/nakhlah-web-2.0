    <use href="#mbu-box"/>
    <path d="M226 198h60v306h-60z" fill="#FD433F"/>
    <path d="M226 198h22v306h-22z" fill="#D52D2C" stroke="none"/>
    <path d="M226 198h60v306h-60z"/>

    <!-- Lid with the bow, tilted open -->
    <g transform="rotate(-20 44 198) translate(-8 52)">
