      <path d="M66 78c42-10 96-4 140 12"/>
      <path d="M292 58 404 46c36-4 62 16 62 44s-22 46-56 46l-104-8c8-18 6-64-14-70z" fill="#FC433F"/>
      <path d="M446 78c-42-10-96-4-140 12"/>

      <!-- Bow knot -->
