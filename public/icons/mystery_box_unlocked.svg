      <use href="#mbu-lid" fill="#FDC53A"/>
      <g clip-path="url(#mbu-clip-lid)" stroke="none">
        <path d="M0 184h530v48H0z" fill="#EEAF25"/>
      </g>
      <use href="#mbu-lid"/>

      <!-- Ribbon tails draping over the lid and down the box -->
