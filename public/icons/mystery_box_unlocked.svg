    <path id="mbu-tail-r" d="M282 108C317 155 367 215 417 280 442 315 457 345 450 362L394 338 364 392C337 340 307 250 267 160 254 130 257 110 282 108z"/>
    <clipPath id="mbu-clip-box"><use href="#mbu-box"/></clipPath>
